name: release
run-name: Publish ${{ inputs.tag }}

# PyPI trusts this filename in the pypi environment, which only master can deploy to.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Published release tag, vX.Y.Z"
        required: true
        type: string
      sha:
        description: "Commit the release checks passed on"
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.validate.outputs.version }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Require a published vX.Y.Z release on the checked master commit
        id: validate
        env:
          TAG: ${{ inputs.tag }}
          SHA: ${{ inputs.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF" != refs/heads/master ]]; then
            echo "::error::Publish runs from master only (got $GITHUB_REF)"
            exit 1
          fi
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag '$TAG' must look like vX.Y.Z"
            exit 1
          fi
          if [[ "$(gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" != false ]]; then
            echo "::error::$TAG is not a published release"
            exit 1
          fi
          tag_sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/$TAG" --jq .sha)
          if [[ "$tag_sha" != "$SHA" ]]; then
            echo "::error::$TAG points at $tag_sha, but the release checks ran on $SHA"
            exit 1
          fi
          status=$(gh api "repos/$GITHUB_REPOSITORY/compare/master...$SHA" --jq .status)
          if [[ "$status" != behind && "$status" != identical ]]; then
            echo "::error::$SHA is not on master ($status)"
            exit 1
          fi
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

  release:
    needs: validate
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Free Disk space
        shell: bash
        run: |
          sudo rm -rf /usr/local/lib/android  # will release about 10 GB if you don't need Android
          sudo rm -rf /usr/share/dotnet # will release about 20GB if you don't need .NET

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.10"

      - run: pip install pip --upgrade
      - name: Setup Poetry
        uses: abatilo/actions-poetry@0dd19c9498c3dc8728967849d0d2eae428a8a3d8
        with:
          poetry-version: "2.3.3"

      - name: Write the release version
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          poetry version "$VERSION"
          printf '__version__ = "%s"\n' "$VERSION" > darwin/version/__init__.py

      - name: Build package
        run: poetry build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  notify_release:
    needs: [release]
    if: success()
    uses: ./.github/workflows/JOB_slack_message.yml
    secrets: inherit
    with:
      icon: ":rocket:"
      at_team: true
      message: |
        :tada: *${{ inputs.tag }}* has been released!
        :link:
          - https://pypi.org/project/darwin-py
          - ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ inputs.tag }}

  notify_failed_release:
    needs: [release]
    if: failure()
    uses: ./.github/workflows/JOB_slack_message.yml
    secrets: inherit
    with:
      icon: ":warning:"
      at_team: true
      message: |
        :warning: *${{ inputs.tag }}* Release has failed to be released!

        *An error occurred performing release, and you may need to release manually.*

        :link:
          - ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
