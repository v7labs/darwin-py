# Run tests
name: tests
run-name: Tests

on:
  workflow_call:
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  test:
    name: "Run Testing OS: ${{ matrix.os }} Python: ${{ matrix.python-version }}"
    strategy:
      # One failing leg must not cancel the others: the remaining legs are the
      # evidence for what broke, including blocked egress.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Free Disk space
        shell: bash
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo rm -rf /usr/local/lib/android  # will release about 10 GB if you don't need Android
          sudo rm -rf /usr/share/dotnet # will release about 20GB if you don't need .NET
      # Pull request code runs in this job, so egress is limited to GitHub,
      # PyPI, the OS package sources and the public schema bucket the tests
      # read. Harden Runner enforces the policy on Ubuntu, macOS and Windows.
      # The runner user keeps sudo, which the install steps need, so on Ubuntu
      # this contains dependency and accidental egress rather than code that
      # sets out to lift it. The boundary for hostile pull request code is the
      # read-only token and the absence of secrets in fork runs.
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            archive.ubuntu.com:80
            azure.archive.ubuntu.com:80
            codeload.github.com:443
            community.chocolatey.org:443
            darwin-public.s3.eu-west-1.amazonaws.com:443
            esm.ubuntu.com:443
            files.pythonhosted.org:443
            formulae.brew.sh:443
            ghcr.io:443
            github.com:443
            motd.ubuntu.com:443
            objects.githubusercontent.com:443
            packages.chocolatey.org:443
            packages.microsoft.com:443
            pkg-containers.githubusercontent.com:443
            pypi.org:443
            raw.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            security.ubuntu.com:80

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies with retry
        uses: nick-invision/retry@ad984534de44a9489a53aefd81eb77f87c70dc60
        with:
          timeout_minutes: 10
          max_attempts: 3
          command: |
            bash -c "pip install poetry pytest && \
                     poetry install --no-interaction --no-root -vvv --all-extras && \
                     poetry install --no-interaction --no-root --all-extras -vvv && \
                     pip install wheel && \
                     pip install --upgrade setuptools && \
                     pip install --editable '.[test,ml,medical,dev,ocv,storage_aws,storage_gcp,storage_azure]'"

      - name: Install ffmpeg (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install ffmpeg (macOS)
        if: matrix.os == 'macos-latest'
        shell: bash
        run: brew install ffmpeg

      - name: Install ffmpeg (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: choco install ffmpeg -y --version 9.0.0

      # choco exits 0 when the feed is unavailable and nothing gets installed
      - name: Verify ffmpeg (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: ffmpeg -version

      - name: Run pytest
        shell: bash # Stops Windows hosts from using PowerShell
        env:
          RUN_CLOUD_STORAGE_TESTS: "1"
        run: |
          python -m pytest
