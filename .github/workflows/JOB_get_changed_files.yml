name: get_changed_files
run-name: Get changed get_changed_files

on:
  workflow_call:
    outputs:
      changed_files:
        description: "Changed files"
        value: ${{ jobs.get_changed_files.outputs.changed_files }}
      python_changed_files:
        description: "Changed python files"
        value: ${{ jobs.get_changed_files.outputs.python_changed_files }}
      yaml_changed_files:
        description: "Changed yaml files"
        value: ${{ jobs.get_changed_files.outputs.yaml_changed_files }}
      json_changed_files:
        description: "Changed json files"
        value: ${{ jobs.get_changed_files.outputs.json_changed_files }}

permissions:
  contents: read

jobs:
  get_changed_files:
    name: Get changed files
    runs-on: ubuntu-latest
    outputs:
      changed_files: ${{ steps.changed_files.outputs.changed_files }}
      python_changed_files: ${{ steps.changed_python_files.outputs.python_changed_files }}
      yaml_changed_files: ${{ steps.changed_yaml_files.outputs.yaml_changed_files }}
      json_changed_files: ${{ steps.changed_json_files.outputs.json_changed_files }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref || github.ref }}
          persist-credentials: false

      # File names come from the pull request and are untrusted. They reach the
      # shell only through environment variables, never through ${{ }} expansion
      # inside a run: block. The list is space separated, so a name that
      # contains a space is not supported; it is split and skipped downstream.
      # Outputs use a random heredoc delimiter so a file name cannot end the
      # value early. The token is only present in the step that calls the API.
      - name: Get changed files
        id: changed_files
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.number }}
        run: |
          set -euo pipefail
          changed_files=$(gh api "repos/$REPO/pulls/$PR_NUMBER/files" --paginate --jq '.[].filename' | tr '\n' ' ')
          changed_files=${changed_files% }
          echo "Changed files: $changed_files"
          delim="EOF_$(od -An -N16 -tx1 /dev/urandom | tr -d ' \n')"
          {
            echo "changed_files<<$delim"
            echo "$changed_files"
            echo "$delim"
          } >> "$GITHUB_OUTPUT"
      - name: Get changed python files
        id: changed_python_files
        shell: bash
        env:
          CHANGED_FILES: ${{ steps.changed_files.outputs.changed_files }}
        run: |
          set -euo pipefail -f
          # shellcheck disable=SC2086 # the list is split into one argument per file on purpose
          changed_files=$(python3 "$GITHUB_WORKSPACE/deploy/_filter_files.py" py $CHANGED_FILES)
          echo "Changed python files: $changed_files"
          delim="EOF_$(od -An -N16 -tx1 /dev/urandom | tr -d ' \n')"
          {
            echo "python_changed_files<<$delim"
            echo "$changed_files"
            echo "$delim"
          } >> "$GITHUB_OUTPUT"
      - name: Get changed yaml files
        id: changed_yaml_files
        shell: bash
        env:
          CHANGED_FILES: ${{ steps.changed_files.outputs.changed_files }}
        run: |
          set -euo pipefail -f
          # shellcheck disable=SC2086 # the list is split into one argument per file on purpose
          changed_files=$(python3 "$GITHUB_WORKSPACE/deploy/_filter_files.py" yml $CHANGED_FILES)
          echo "Changed yaml files: $changed_files"
          delim="EOF_$(od -An -N16 -tx1 /dev/urandom | tr -d ' \n')"
          {
            echo "yaml_changed_files<<$delim"
            echo "$changed_files"
            echo "$delim"
          } >> "$GITHUB_OUTPUT"
      - name: Get changed json files
        id: changed_json_files
        shell: bash
        env:
          CHANGED_FILES: ${{ steps.changed_files.outputs.changed_files }}
        run: |
          set -euo pipefail -f
          # shellcheck disable=SC2086 # the list is split into one argument per file on purpose
          changed_files=$(python3 "$GITHUB_WORKSPACE/deploy/_filter_files.py" json $CHANGED_FILES)
          echo "Changed json files: $changed_files"
          delim="EOF_$(od -An -N16 -tx1 /dev/urandom | tr -d ' \n')"
          {
            echo "json_changed_files<<$delim"
            echo "$changed_files"
            echo "$delim"
          } >> "$GITHUB_OUTPUT"
