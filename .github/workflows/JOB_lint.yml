name: lint
run-name: Check linting

on:
  workflow_call:
    inputs:
      files:
        type: string
        description: "Files to lint"
        required: true

permissions:
  contents: read

jobs:
  lint:
    if: ${{ inputs.files != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - name: Harden Runner
      uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
      with:
        egress-policy: block
        allowed-endpoints: >
          api.github.com:443
          files.pythonhosted.org:443
          github.com:443
          objects.githubusercontent.com:443
          pypi.org:443
          raw.githubusercontent.com:443
          release-assets.githubusercontent.com:443

    - name: Check out source repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Set up Python environment
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: "3.12"

    # The file list comes from the pull request and is untrusted, so it reaches
    # the shell through an environment variable, never through ${{ }} in run:.
    - name: Ruff Lint
      shell: bash
      env:
        FILES: ${{ inputs.files }}
      run: |
        set -euo pipefail -f
        # shellcheck disable=SC2086 # one argument per file on purpose
        bash -f "$GITHUB_WORKSPACE/deploy/format_lint.sh" lint $FILES
