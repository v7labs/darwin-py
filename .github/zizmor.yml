# zizmor policy. EVENT_workflow_security.yml reads this file from the base
# branch and fails pull requests on high-severity findings. Inline
# "zizmor: ignore" comments are not honored; every exception lives here.
rules:
  # pull_request_target is the safe pattern in both files: the job definition
  # comes from the base branch, nothing from the pull request is executed, the
  # token is read-only and no secrets are available.
  dangerous-triggers:
    ignore:
      - independent-approval.yml
      - EVENT_workflow_security.yml
  # Existing findings tracked in DAR-8214. Remove entries as files are fixed.
  template-injection:
    ignore:
      - JOB_slack_message.yml
      - JOB_typecheck.yml
      - version_bump.yml
  excessive-permissions:
    ignore:
      - EVENT_merge_to_master.yml
