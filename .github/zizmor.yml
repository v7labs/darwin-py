# zizmor configuration. EVENT_workflow_security.yml fails pull requests on
# high-severity findings. The entries below are pre-existing findings that are
# tracked in DAR-8214 and must be removed from this list as each file is fixed,
# not extended.
rules:
  template-injection:
    ignore:
      - JOB_slack_message.yml
      - JOB_typecheck.yml
      - version_bump.yml
  excessive-permissions:
    ignore:
      - EVENT_merge_to_master.yml
